<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Motorbike - Xe Máy Lách Phố</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            background-color: #70c5ce;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 32px;
            color: #ffca28;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            margin-bottom: 20px;
            color: #e0e0e0;
        }

        .btn {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s, background 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .score-board {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .score-board div {
            font-size: 20px;
            margin: 5px 0;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Màn hình bắt đầu -->
        <div id="start-screen" class="ui-screen">
            <h1>FLAPPY MOTORBIKE 🛵</h1>
            <p>Nhấn <b>Space / Click chuột / Cạm màn hình</b> để rồ ga bốc đầu tránh chướng ngại vật!</p>
            <button class="btn" id="start-btn">BẮT ĐẦU CHƠI</button>
        </div>

        <!-- Màn hình Game Over -->
        <div id="game-over-screen" class="ui-screen hidden">
            <h1 style="color: #ff5252;">GAME OVER 💥</h1>
            <div class="score-board">
                <div>Điểm số: <span id="final-score" style="color: #ffca28;">0</span></div>
                <div>Kỷ lục: <span id="high-score" style="color: #4caf50;">0</span></div>
            </div>
            <button class="btn" id="restart-btn">CHƠI LẠI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreDisplay = document.getElementById('final-score');
        const highScoreDisplay = document.getElementById('high-score');

        // Web Audio API
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'score') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // Biến trạng thái game
        let gameState = 'START';
        let score = 0;
        let highScore = localStorage.getItem('motorbike_high_score') || 0;
        let frames = 0;

        // Đối tượng xe máy
        const bike = {
            x: 80,
            y: 250,
            width: 40,
            height: 25,
            gravity: 0.35,
            lift: -6.5,
            velocity: 0,
            rotation: 0,

            jump() {
                this.velocity = this.lift;
                playSound('jump');
            },

            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                // Xoay đầu xe theo vận tốc
                if (this.velocity < 0) {
                    this.rotation = Math.max(-0.4, this.velocity * 0.05);
                } else {
                    this.rotation = Math.min(0.6, this.velocity * 0.04);
                }

                // Va chạm trần và đất
                if (this.y + this.height >= canvas.height - 50) {
                    this.y = canvas.height - 50 - this.height;
                    endGame();
                }
                if (this.y <= 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            },

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(this.rotation);

                // Khung xe máy
                ctx.fillStyle = '#e53935'; // Thân đỏ
                ctx.fillRect(-15, -8, 28, 12);

                // Đầu xe & Đèn
                ctx.fillStyle = '#ffb74d';
                ctx.fillRect(10, -12, 6, 10);
                ctx.fillStyle = '#fff176';
                ctx.fillRect(15, -10, 4, 4);

                // Người lái
                ctx.fillStyle = '#1e88e5'; // Áo
                ctx.fillRect(-8, -18, 12, 10);
                ctx.fillStyle = '#424242'; // Nón bảo hiểm
                ctx.beginPath();
                ctx.arc(-2, -20, 7, 0, Math.PI * 2);
                ctx.fill();

                // Bánh xe trước & sau
                ctx.fillStyle = '#212121';
                ctx.beginPath();
                ctx.arc(-12, 8, 7, 0, Math.PI * 2);
                ctx.arc(12, 8, 7, 0, Math.PI * 2);
                ctx.fill();

                // Mâm xe
                ctx.fillStyle = '#e0e0e0';
                ctx.beginPath();
                ctx.arc(-12, 8, 3, 0, Math.PI * 2);
                ctx.arc(12, 8, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        };

        // Chướng ngại vật (Cột gạch / Rào chắn)
        const obstacles = [];
        const obstacleWidth = 52;
        const obstacleGap = 150;

        function spawnObstacle() {
            const minHeight = 60;
            const maxHeight = canvas.height - 50 - obstacleGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            obstacles.push({
                x: canvas.width,
                top: topHeight,
                bottom: canvas.height - 50 - topHeight - obstacleGap,
                passed: false
            });
        }

        function updateObstacles() {
            if (frames % 100 === 0) {
                spawnObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= 2;

                // Kiểm tra va chạm với xe máy
                const bikeRight = bike.x + bike.width;
                const bikeLeft = bike.x;
                const bikeTop = bike.y;
                const bikeBottom = bike.y + bike.height;

                const obsRight = obs.x + obstacleWidth;

                if (bikeRight > obs.x && bikeLeft < obsRight) {
                    if (bikeTop < obs.top || bikeBottom > canvas.height - 50 - obs.bottom) {
                        endGame();
                    }
                }

                // Tính điểm khi vượt qua
                if (!obs.passed && obs.x + obstacleWidth < bike.x) {
                    obs.passed = true;
                    score++;
                    playSound('score');
                }

                // Xóa cột đã đi khỏi màn hình
                if (obs.x + obstacleWidth < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function drawObstacles() {
            obstacles.forEach(obs => {
                // Cột trên
                ctx.fillStyle = '#d84315';
                ctx.fillRect(obs.x, 0, obstacleWidth, obs.top);
                ctx.fillStyle = '#bf360c';
                ctx.fillRect(obs.x - 3, obs.top - 15, obstacleWidth + 6, 15);

                // Cột dưới
                const bottomY = canvas.height - 50 - obs.bottom;
                ctx.fillStyle = '#d84315';
                ctx.fillRect(obs.x, bottomY, obstacleWidth, obs.bottom);
                ctx.fillStyle = '#bf360c';
                ctx.fillRect(obs.x - 3, bottomY, obstacleWidth + 6, 15);
            });
        }

        // Vẽ đường phố & Hậu cảnh
        let roadOffset = 0;
        function drawEnvironment() {
            // Nền trời
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Mặt đường
            ctx.fillStyle = '#424242';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

            // Vỉa hè / Vạch kẻ đường
            ctx.fillStyle = '#f57c00';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 6);

            ctx.fillStyle = '#ffffff';
            roadOffset = (roadOffset - 2) % 30;
            for (let i = roadOffset; i < canvas.width; i += 30) {
                ctx.fillRect(i, canvas.height - 25, 15, 4);
            }
        }

        // Điểm số hiển thị góc trên
        function drawScore() {
            if (gameState === 'PLAYING') {
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;
                ctx.font = 'bold 36px sans-serif';
                ctx.strokeText(score, canvas.width / 2 - 10, 50);
                ctx.fillText(score, canvas.width / 2 - 10, 50);
            }
        }

        // Vòng lặp chính của Game
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawEnvironment();

            if (gameState === 'PLAYING') {
                bike.update();
                updateObstacles();
                frames++;
            }

            drawObstacles();
            bike.draw();
            drawScore();

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameState = 'PLAYING';
            score = 0;
            frames = 0;
            bike.y = 250;
            bike.velocity = 0;
            obstacles.length = 0;

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
        }

        function endGame() {
            gameState = 'GAMEOVER';
            playSound('hit');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('motorbike_high_score', highScore);
            }

            finalScoreDisplay.textContent = score;
            highScoreDisplay.textContent = highScore;
            gameOverScreen.classList.remove('hidden');
        }

        // Xử lý điều khiển
        function handleAction() {
            if (gameState === 'PLAYING') {
                bike.jump();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                handleAction();
            }
        });

        canvas.addEventListener('click', handleAction);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleAction();
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Bắt đầu chạy giao diện
        gameLoop();
    </script>
</body>
</html>
